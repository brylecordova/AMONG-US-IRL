  <g stroke="#ef4444" stroke-width="2" fill="none">
    <path d="M 1140 42 L 1162 42 L 1162 64"/>
    <path d="M 1140 298 L 1162 298 L 1162 276"/>
  </g>

  <!-- Top Telemetry Bar -->
  <text x="64" y="64" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="2.2">
    VESSEL // THE SKELD IRL
  </text>
  <text x="580" y="64" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" text-anchor="middle">
    SECTOR 04 // SOCIAL DEDUCTION TELEMETRY
  </text>
  <rect x="978" y="51" width="158" height="20" rx="3" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.65" stroke-width="1"/>
  <circle cx="993" cy="61" r="3.5" fill="#ef4444"/>
  <text x="1005" y="65" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.6">
    SYSTEMS ARMED
  </text>

  <!-- Main Title Block -->
  <text x="600" y="152" fill="url(#titleGlow)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="9" text-anchor="middle">
    AMONG-US IRL
  </text>

  <!-- Center Accent Bar -->
  <line x1="250" y1="176" x2="545" y2="176" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
  <polygon points="560,176 575,170 625,170 640,176 625,182 575,182" fill="#0ea5e9" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1"/>
  <line x1="655" y1="176" x2="950" y2="176" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.7"/>

  <text x="600" y="212" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="3.5" text-anchor="middle">
    SHIPBOARD FIELD OPERATIONS MANUAL
  </text>
  <text x="600" y="237" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" letter-spacing="0.4" text-anchor="middle">
    Real-Time QR Mission Control  ·  Live 15 FPS Security Optics  ·  Android APK &amp; Web HUD
  </text>

  <!-- Bottom Telemetry Strip -->
  <line x1="64" y1="266" x2="1136" y2="266" stroke="#1e293b" stroke-width="1"/>
  <text x="64" y="287" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">
    BRIDGE: NODE + EXPRESS + WS
  </text>
  <text x="392" y="287" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">
    DECK UI: REACT 19 + TYPESCRIPT
  </text>
  <text x="724" y="287" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">
    FIELD UNITS: KOTLIN CAMERAX + WEB
  </text>
  <text x="1136" y="287" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" text-anchor="end">
    PORT // 3000
  </text>

  <!-- Scanline Overlay -->
  <rect width="1200" height="340" rx="14" fill="url(#scanlines)"/>
</svg>
