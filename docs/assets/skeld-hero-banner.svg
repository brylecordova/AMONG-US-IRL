    <circle cx="698" cy="78" r="0.9" opacity="0.5"/>
    <circle cx="758" cy="38" r="1.2" opacity="0.75"/>
    <circle cx="814" cy="96" r="1.0" opacity="0.65"/>
    <circle cx="868" cy="52" r="1.4" opacity="0.85"/>
    <circle cx="922" cy="118" r="0.9" opacity="0.55"/>
    <circle cx="984" cy="44" r="1.2" opacity="0.8"/>
    <circle cx="1044" cy="88" r="1.5" opacity="0.9"/>
    <circle cx="1096" cy="48" r="0.9" opacity="0.6"/>
    <circle cx="1142" cy="112" r="1.1" opacity="0.75"/>
    <circle cx="88" cy="248" r="1.0" opacity="0.65"/>
    <circle cx="146" cy="288" r="1.4" opacity="0.85"/>
    <circle cx="218" cy="264" r="0.8" opacity="0.5"/>
    <circle cx="284" cy="304" r="1.1" opacity="0.7"/>
    <circle cx="372" cy="276" r="0.9" opacity="0.55"/>
    <circle cx="468" cy="298" r="1.2" opacity="0.75"/>
    <circle cx="554" cy="268" r="0.8" opacity="0.5"/>
    <circle cx="662" cy="302" r="1.3" opacity="0.8"/>
    <circle cx="746" cy="274" r="0.9" opacity="0.55"/>
    <circle cx="838" cy="296" r="1.1" opacity="0.7"/>
    <circle cx="934" cy="262" r="1.4" opacity="0.85"/>
    <circle cx="1028" cy="294" r="0.9" opacity="0.6"/>
    <circle cx="1118" cy="252" r="1.2" opacity="0.75"/>
