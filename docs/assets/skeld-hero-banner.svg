  <!-- Star Glints -->
  <g fill="#bae6fd" opacity="0.85">
    <path d="M 164 26 L 166 34 L 174 36 L 166 38 L 164 46 L 162 38 L 154 36 L 162 34 Z"/>
    <path d="M 1044 78 L 1046 86 L 1054 88 L 1046 90 L 1044 98 L 1042 90 L 1034 88 L 1042 86 Z"/>
    <path d="M 934 254 L 935.5 260.5 L 942 262 L 935.5 263.5 L 934 270 L 932.5 263.5 L 926 262 L 932.5 260.5 Z"/>
  </g>

  <!-- Orbital Arcs & Navigation Reticle (Right Side) -->
  <g fill="none" stroke-opacity="0.28">
    <circle cx="1010" cy="170" r="126" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 8"/>
    <circle cx="1010" cy="170" r="88" stroke="#f87171" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="1010" cy="170" r="46" stroke="#94a3b8" stroke-width="1"/>
    <line x1="940" y1="170" x2="1080" y2="170" stroke="#38bdf8" stroke-width="0.9"/>
    <line x1="1010" y1="100" x2="1010" y2="240" stroke="#38bdf8" stroke-width="0.9"/>
  </g>
  <circle cx="1064" cy="126" r="4" fill="#ef4444" opacity="0.85"/>
  <circle cx="964" cy="204" r="3.5" fill="#38bdf8" opacity="0.9"/>

  <!-- Left Orbital Trajectory -->
  <path d="M -20 265 Q 240 205 560 280 T 1220 220" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 7"/>

  <!-- Outer Hull Frame -->
  <rect x="14" y="14" width="1172" height="312" rx="10" fill="none" stroke="url(#hullBorder)" stroke-width="1.5"/>

  <!-- Chamfered Inner Viewport -->
  <polygon points="44,32 1156,32 1172,48 1172,292 1156,308 44,308 28,292 28,48" fill="#040814" fill-opacity="0.48" stroke="#1e293b" stroke-width="1.2"/>

