<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="AMONG-US IRL - Shipboard Field Operations Manual">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030612"/>
      <stop offset="50%" stop-color="#081024"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <radialGradient id="nebulaCyan" cx="22%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#030612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCrimson" cx="82%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#b91c1c" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#030612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.16"/>
    </pattern>
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="1200" height="340" rx="14" fill="url(#spaceBg)"/>
  <rect width="1200" height="340" rx="14" fill="url(#radarGrid)"/>
  <rect width="1200" height="340" rx="14" fill="url(#nebulaCyan)"/>
  <rect width="1200" height="340" rx="14" fill="url(#nebulaCrimson)"/>

  <!-- Starfield -->
  <g fill="#e2e8f0">
    <circle cx="64" cy="48" r="1.2" opacity="0.8"/>
    <circle cx="118" cy="92" r="0.9" opacity="0.55"/>
    <circle cx="164" cy="36" r="1.4" opacity="0.9"/>
    <circle cx="212" cy="144" r="0.8" opacity="0.5"/>
