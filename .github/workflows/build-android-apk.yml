name: Build Android Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate sideload signing keystore
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'amongusirl' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'amongusirl' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || 'amongusirl' }}
        run: |
          keytool -genkeypair -v \
            -keystore android-app/release-keystore.jks \
            -storepass "$KEYSTORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AmongUsIRL, OU=Companion, O=LocalHost, L=LAN, S=NA, C=US"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'amongusirl' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'amongusirl' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'amongusirl' }}
        run: |
          gradle -p android-app assembleRelease --no-daemon

      - name: Package among-us-irl.apk
        run: |
          APK_PATH=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" android-app/among-us-irl.apk
          ls -lh android-app/among-us-irl.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: among-us-irl-apk
          path: android-app/among-us-irl.apk
          if-no-files-found: error
